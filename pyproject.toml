[project]
name = "agentic-hybrid-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "ddgs>=9.16.0",
    "docling>=2.126.0",
    "duckduckgo-search>=8.1.1",
    "kuzu>=0.11.3",
    "langgraph>=1.2.11",
    "openai>=3.13.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
